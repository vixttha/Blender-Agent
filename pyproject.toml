[build-system]
requires = ["setuptools>=77.0.3,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-agent"
version = "0.0.2.18"
description = "Harness-neutral tools for safe Blender asset workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.optional-dependencies]
mcp = ["mcp>=1.30.0,<2"]

[project.scripts]
blender-agent = "blender_agent.cli:main"
blender-agent-mcp = "blender_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blender_agent = ["blender_worker.py"]
