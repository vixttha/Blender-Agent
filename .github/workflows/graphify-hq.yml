name: Blender-Agent Graphify HQ

on:
  push:
    branches: [graphify-hq]
  pull_request:
    branches: [graphify-hq]
    paths:
      - '.github/workflows/graphify-hq.yml'
      - 'README.md'
      - 'SECURITY.md'
      - 'catalog/**'
      - 'candidates/**'
      - 'versions/**'
      - 'tests/fixtures/**'
      - 'tools/graphify/**'

permissions:
  contents: read

concurrency:
  group: blender-agent-graphify-hq
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONHASHSEED: '0'

jobs:
  graphify:
    name: Rebuild version maps and query Graphify MCP
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install pinned Graphify dependencies
        run: >-
          python -m pip install --no-cache-dir --only-binary=:all: --no-deps
          -r tools/graphify/requirements.txt
      - name: Compile and self-test version graph generator
        run: |
          python -m compileall -q tools/graphify/version_maps.py
          python tools/graphify/version_maps.py --self-test
      - name: Verify committed version maps and Graphify MCP
        run: |
          printf 'Verified graphify-hq SHA: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          python tools/graphify/version_maps.py --generate
          git diff --exit-code -- versions/v0.0.2
      - name: Emit exact-tag archive files for review
        run: |
          python - <<'PY'
          import base64
          import json
          from pathlib import Path

          paths = ("versions/README.md", "versions/v0.0.3/README.md",
                   "versions/v0.0.3/graph.json", "versions/v0.0.3/receipt.json")
          for name in paths:
              data = base64.b64encode(Path(name).read_bytes()).decode("ascii")
              for index in range(0, len(data), 3000):
                  print("GRAPHIFY_RELEASE_ARTIFACT " + json.dumps({
                      "path": name, "part": index // 3000, "data": data[index:index + 3000],
                  }), flush=True)
          PY
      - name: Rebuild and verify candidate archive with Graphify MCP
        run: |
          python tools/graphify/candidate_maps.py --check
