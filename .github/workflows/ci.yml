name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit and negative-path tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: CLI version
        run: python -m blender_agent version

  mcp-stdio:
    name: Real MCP stdio / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install actual MCP server and client SDK
        run: python -m pip install -e ".[mcp]"
      - name: Verify installed MCP launcher through a stdio host
        run: python tests/test_mcp_smoke.py

  blender-smoke:
    name: Blender 4.5 real-format roundtrips
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install with the MCP SDK
        run: python -m pip install -e ".[mcp]"
      - name: Download and verify official Blender 4.5.0
        shell: bash
        run: |
          curl --fail --location --retry 3 --retry-delay 3 --silent --show-error \
            https://download.blender.org/release/Blender4.5/blender-4.5.0-linux-x64.tar.xz -o blender.tar.xz
          echo "1188b95cc12321c770b631939f7c25a096910b6f884a990bf9c0f62d52b38aec  blender.tar.xz" | sha256sum --check -
          mkdir -p blender-dist
          tar -xf blender.tar.xz -C blender-dist --strip-components=1
          ./blender-dist/blender --version | head -n 3
      - name: Exercise supported formats and validate mesh geometry
        shell: bash
        env:
          BLENDER_BIN: ./blender-dist/blender
        run: |
          mkdir -p asset-sandbox/out
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" create cube out/cube.stl --size 1
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.stl out/cube.glb
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.glb out/roundtrip.stl
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.stl out/cube.obj
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.obj out/from_obj.stl
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.stl out/cube.fbx
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.fbx out/from_fbx.stl
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.stl out/cube.blend
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.blend out/from_blend.stl
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" repair out/cube.stl out/repaired.stl
          python - <<'PY'
          from pathlib import Path
          from blender_agent.inspect import inspect_asset
          root = Path("asset-sandbox")
          all_files = [
              "cube.stl", "cube.glb", "roundtrip.stl", "cube.obj",
              "from_obj.stl", "cube.fbx", "from_fbx.stl",
              "cube.blend", "from_blend.stl", "repaired.stl",
          ]
          for name in all_files:
              f = root / "out" / name
              assert f.is_file() and f.stat().st_size > 0, name
          for name in (
              "cube.stl", "roundtrip.stl", "from_obj.stl", "from_fbx.stl",
              "from_blend.stl", "repaired.stl",
          ):
              info = inspect_asset("out/" + name, root)
              assert info["triangles"] == 12, (name, info)
              for axis in range(3):
                  assert abs(info["bounds"]["min"][axis] + 0.5) < 0.005, (name, info)
                  assert abs(info["bounds"]["max"][axis] - 0.5) < 0.005, (name, info)
          print("Blender 4.5 real-format geometry roundtrip: PASS")
          PY
      - name: Exercise create, convert, repair and inspect over MCP stdio
        env:
          BLENDER_BIN: ${{ github.workspace }}/blender-dist/blender
        run: python tests/test_mcp_smoke.py --blender "$BLENDER_BIN"
