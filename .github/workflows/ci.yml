name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Record interpreter and platform
        run: python -c "import platform; print(platform.python_version(), platform.platform())"
      - name: Unit and negative-path tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: CLI version
        run: python -m blender_agent version
      - name: Build and verify a wheel with the minimum setuptools version
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        run: |
          minimum=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          build = tomllib.loads(Path("pyproject.toml").read_text())["build-system"]
          requirement = next(item for item in build["requires"] if item.startswith("setuptools>="))
          print(requirement.removeprefix("setuptools>=").split(",")[0])
          PY
          )
          python -m venv "$RUNNER_TEMP/minimum-build"
          minimum_python="$RUNNER_TEMP/minimum-build/bin/python"
          "$minimum_python" -m pip install "setuptools==$minimum" wheel
          "$minimum_python" -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheels" .
          "$minimum_python" -m pip install --no-deps "$RUNNER_TEMP"/wheels/blender_agent-*.whl
          cd "$RUNNER_TEMP"
          "$minimum_python" - <<'PY'
          from importlib.metadata import metadata, version
          from blender_agent import __version__
          package = metadata("blender-agent")
          assert package["License-Expression"] == "MIT", package
          assert "LICENSE" in package.get_all("License-File"), package
          assert package["Version"] == __version__, package
          print(f"setuptools {version('setuptools')} wheel: SPDX MIT and installed {__version__} verified.")
          PY

  mcp-stdio:
    name: Real MCP stdio / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build the wheel and verify its installed MCP launcher
        run: python tests/run_mcp_wheel_smoke.py

  blender-smoke:
    name: Blender ${{ matrix.version }} real-format roundtrips
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "4.1.0"
            series: "4.1"
            sha256: d2ac5390f4a9cb9416c8eb23bdd8fa8e49e68165a889575fd8f56563f5cccaf1
            mcp-mode: minimum
          - version: "4.5.0"
            series: "4.5"
            sha256: 1188b95cc12321c770b631939f7c25a096910b6f884a990bf9c0f62d52b38aec
            mcp-mode: resolver
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Blender-Agent for the CLI roundtrip
        run: python -m pip install -e .
      - name: Download and verify official Blender
        shell: bash
        env:
          BLENDER_VERSION: ${{ matrix.version }}
          BLENDER_SERIES: ${{ matrix.series }}
          BLENDER_SHA256: ${{ matrix.sha256 }}
        run: |
          release="release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          if ! curl --fail --location --retry 2 --silent --show-error "https://download.blender.org/$release" -o blender.tar.xz; then
            curl --fail --location --retry 2 --silent --show-error "https://mirror.clarkson.edu/blender/$release" -o blender.tar.xz
          fi
          printf '%s  blender.tar.xz\n' "$BLENDER_SHA256" | sha256sum --check -
          mkdir -p blender-dist
          tar -xf blender.tar.xz -C blender-dist --strip-components=1
          ./blender-dist/blender --version | head -n 3
      - name: Exercise supported formats and validate mesh geometry
        shell: bash
        env:
          BLENDER_BIN: ./blender-dist/blender
        run: |
          mkdir -p asset-sandbox/out
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" create cube out/cube.stl --size 1
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.stl out/cube.glb
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.glb out/roundtrip.stl
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.stl out/cube.obj
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.obj out/from_obj.stl
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.stl out/cube.fbx
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.fbx out/from_fbx.stl
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.stl out/cube.blend
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" convert out/cube.blend out/from_blend.stl
          python -m blender_agent --workspace asset-sandbox --blender "$BLENDER_BIN" repair out/cube.stl out/repaired.stl
          python - <<'PY'
          from pathlib import Path
          from blender_agent.inspect import inspect_asset
          root = Path("asset-sandbox")
          all_files = [
              "cube.stl", "cube.glb", "roundtrip.stl", "cube.obj",
              "from_obj.stl", "cube.fbx", "from_fbx.stl",
              "cube.blend", "from_blend.stl", "repaired.stl",
          ]
          for name in all_files:
              f = root / "out" / name
              assert f.is_file() and f.stat().st_size > 0, name
          for name in (
              "cube.stl", "roundtrip.stl", "from_obj.stl", "from_fbx.stl",
              "from_blend.stl", "repaired.stl",
          ):
              info = inspect_asset("out/" + name, root)
              assert info["triangles"] == 12, (name, info)
              for axis in range(3):
                  assert abs(info["bounds"]["min"][axis] + 0.5) < 0.005, (name, info)
                  assert abs(info["bounds"]["max"][axis] - 0.5) < 0.005, (name, info)
          print("Blender real-format geometry roundtrip: PASS")
          PY
      - name: Exercise the installed MCP wheel with real Blender
        env:
          BLENDER_BIN: ${{ github.workspace }}/blender-dist/blender
          MCP_MODE: ${{ matrix.mcp-mode }}
        run: python tests/run_mcp_wheel_smoke.py --blender "$BLENDER_BIN" --mcp-mode "$MCP_MODE"
