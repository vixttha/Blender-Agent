name: Audit Blender-Agent Code Stack

on:
  push:
    branches: [code-stack]
  pull_request:
    branches: [code-stack]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Resolve the pinned revisions
        id: registry
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'Checkout %s\nPR head %s\nPR base %s\nRunner %s %s\n' \
            "$GITHUB_SHA" "$PR_HEAD" "$PR_BASE" "$RUNNER_ENVIRONMENT" "$RUNNER_OS"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          from pathlib import Path

          registry = json.loads(Path("code-stack.json").read_text(encoding="utf-8"))
          if registry["source_repository"].casefold() != os.environ["EXPECTED_REPOSITORY"].casefold():
              raise SystemExit("The registry must audit this repository")
          for key in ("source_commit", "template_commit"):
              revision = registry[key]
              if not re.fullmatch(r"[0-9a-f]{40}", revision):
                  raise SystemExit(f"Invalid GitHub {key}")
              print(f"{key}={revision}")
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.registry.outputs.source_commit }}
          path: audited-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.registry.outputs.template_commit }}
          path: audited-template
          persist-credentials: false
      - name: Verify the kit and audit the release
        env:
          TEMPLATE_SHA: ${{ steps.registry.outputs.template_commit }}
        run: |
          test "$(git -C audited-template rev-parse HEAD)" = "$TEMPLATE_SHA"
          cmp tools/audit.py audited-template/v0.0.2/tools/audit.py
          cmp tools/test_audit.py audited-template/v0.0.2/tools/test_audit.py
          cmp STACK.md audited-template/v0.0.2/STACK.md
          python3 tools/audit.py --repo audited-source --config code-stack.json \
            --live-ref refs/remotes/origin/main --release-ref refs/tags/v0.0.2 \
            --summary "$GITHUB_STEP_SUMMARY"
