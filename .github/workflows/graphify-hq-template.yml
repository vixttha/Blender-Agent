name: Graphify HQ template verification

on:
  push:
    branches: [graphify-hq-template]
  pull_request:
    branches: [graphify-hq-template, feat/graphify-hq-runner-modes, fix/graphify-hq-v0.0.8.1]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONHASHSEED: '0'

jobs:
  verify:
    name: Test template and verify its Graphify archive
    if: >-
      (toJSON(github.event.repository.private) == 'false' &&
       contains(fromJSON('["","public"]'), github.event.repository.visibility || '')) ||
      ((toJSON(github.event.repository.private) == 'true' ||
        contains(fromJSON('["private","internal"]'), github.event.repository.visibility)) &&
       github.event_name == 'push' &&
       vars.GRAPHIFY_PRIVATE_SELF_HOSTED == 'true')
    runs-on: >-
      ${{ (toJSON(github.event.repository.private) == 'false' &&
           contains(fromJSON('["","public"]'), github.event.repository.visibility || '')) &&
          'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","graphify-hq"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Test and rebuild version evidence
        run: |
          python -m unittest discover -s tools -p 'test_verify_archive.py' -v
          python tools/verify_archive.py
      - name: Test the repair candidate with the pinned dependency lock
        run: |
          python -m pip install --require-hashes --no-cache-dir --only-binary=:all: --no-deps -r versions/v0.0.8/requirements.txt
          python -m pip check
          python -m unittest discover -s candidate -p 'test_*.py' -v
