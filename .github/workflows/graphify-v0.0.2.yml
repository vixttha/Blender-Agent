name: Generate Blender-Agent v0.0.2 Graphify archive

on:
  push:
    branches: [ci/archive-graphify-v0.0.2]
    paths: ['.github/workflows/graphify-v0.0.2.yml']

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONHASHSEED: '0'

jobs:
  graphify:
    name: Generate release graph and verify MCP read-back
    if: github.repository == 'vixttha/Blender-Agent' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install pinned Graphify dependencies
        run: >-
          python -m pip install --no-cache-dir --only-binary=:all: --no-deps
          -r tools/graphify/requirements.txt
      - name: Generate the approved version map
        run: python tools/graphify/version_maps.py --generate
      - name: Export only the generated public documentation
        run: |
          python - <<'PY'
          import base64
          import gzip
          import json
          from pathlib import Path

          paths = (
              "versions/README.md",
              "versions/v0.0.2/README.md",
              "versions/v0.0.2/graph.json",
              "versions/v0.0.2/receipt.json",
          )
          files = {path: Path(path).read_text(encoding="utf-8") for path in paths}
          compressed = gzip.compress(json.dumps(files).encode(), mtime=0)
          output = base64.b64encode(compressed).decode("ascii")
          chunks = [output[start:start + 1200] for start in range(0, len(output), 1200)]
          for index, chunk in enumerate(chunks):
              print("GRAPHIFY_RELEASE_EXPORT " + json.dumps({
                  "index": index,
                  "total": len(chunks),
                  "chunk": chunk,
              }))
          PY
