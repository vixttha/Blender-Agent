name: Brand identity checks

on:
  push:
    branches: [Brand-Identity-template-v0.0.1, BART-Brand-Identity]
  pull_request:
    branches: [Brand-Identity-template-v0.0.1, BART-Brand-Identity]

permissions:
  contents: read

env:
  BRAND_CHECKOUT_SHA: ${{ github.sha }}
  BRAND_SOURCE_REF: ${{ github.ref }}
  PYTHONHASHSEED: '0'

jobs:
  kit:
    name: Verify brand kit and PNGs
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.BRAND_CHECKOUT_SHA }}
          persist-credentials: false
      - name: Verify exact checkout and kit
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$BRAND_CHECKOUT_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            mapfile -t parents < <(git cat-file -p HEAD | sed -n '/^$/q; s/^parent //p')
            test "${#parents[@]}" -eq 2
            test "${parents[0]}" = "$PR_BASE_SHA"
            test "${parents[1]}" = "$PR_HEAD_SHA"
            printf "PR base: %s\nPR head: %s\n" "$PR_BASE_SHA" "$PR_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 brand-identity/verify.py
          printf 'Brand kit checkout: %s\n' "$BRAND_CHECKOUT_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Exercise the v0.0.2 adoption trial
        run: |
          python3 -m unittest discover -s trials/brand-identity-v0.0.2/brand-identity -p 'test_*.py' -v
          python3 .github/scripts/brand_identity_trial.py

  graphify:
    name: Map brand source and verify Graphify MCP
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.BRAND_CHECKOUT_SHA }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 02bf4de3190a95683faeea0318902c20158f72a1
          path: .graphify-hq
          sparse-checkout: tools/graphify
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the Graphify HQ lock
        run: >-
          python -m pip install --no-deps --only-binary=:all:
          -r .graphify-hq/tools/graphify/requirements.txt
      - name: Graph brand documents and assets
        run: |
          python .github/scripts/brand_graph.py
          cat brand-graph/receipt.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brand-graph
          path: brand-graph/
          retention-days: 1
