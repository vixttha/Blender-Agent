name: Verify release approval

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Final release tag
        required: true
        type: string
      release_sha:
        description: Full approved default-branch commit SHA
        required: true
        type: string
      ci_run_id:
        description: Successful application CI push run ID
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string
      ci_run_id:
        required: true
        type: string
    outputs:
      release_tag:
        value: ${{ jobs.verify.outputs.release_tag }}
      release_sha:
        value: ${{ jobs.verify.outputs.release_sha }}

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify owner dispatch and exact-commit CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.gate.outputs.release_tag }}
      release_sha: ${{ steps.gate.outputs.release_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify release approval
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: python scripts/verify_release_approval.py
