name: Human trial readiness

on:
  push:
    branches: [Human]
    paths:
      - docs/human/**
      - .github/workflows/human-trial.yml

permissions:
  contents: read

jobs:
  readiness:
    name: Verify the pilot walkthrough on public Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the Human candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Record candidate provenance
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s docs/human/README.md
          printf 'Checkout %s\nEvent %s\nRunner %s\n' "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$RUNNER_OS"
      - name: Run the established README CLI and MCP walkthrough
        run: python tools/check_readme_walkthrough.py
