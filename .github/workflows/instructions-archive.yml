name: Instructions Archive - Public SHA Validation

on:
  push:
    branches:
      - chatgpt-project-instructions
  pull_request:
    branches:
      - chatgpt-project-instructions

permissions:
  contents: read

jobs:
  validate:
    name: validate / public Ubuntu / exact SHA
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GRAPHIFY_HQ_SHA: eeaa26d3cdc689beaec55baec78f1dc6bb732b06
      REPO_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - name: Enforce public repository and free GitHub-hosted runner
        shell: bash
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$REPO_VISIBILITY" = "public"
          test "$RUNNER_KIND" = "github-hosted"
          echo "PUBLIC_RUNNER_POLICY=PASS"
      - name: Fetch exact triggering commit without marketplace actions
        shell: bash
        env:
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init --quiet .
          git remote add origin "https://github.com/${REPO_FULL_NAME}.git"
          git fetch --no-tags origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "CHECKED_OUT_SHA=$GITHUB_SHA"
      - name: Verify archive and receipt attribution
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          python3 -m unittest discover -s scripts -v
          python3 scripts/validate_archive.py
      - name: Set up Graphify HQ Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Prepare pinned Graphify HQ tooling
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GRAPHIFY_HQ_SHA"
          graphify_tools="$RUNNER_TEMP/graphify-hq"
          mkdir -p "$graphify_tools"
          git archive "$GRAPHIFY_HQ_SHA" tools/graphify/version_maps.py tools/graphify/requirements.txt | tar -x -C "$graphify_tools"
          printf 'GRAPHIFY_HQ_TOOLS=%s/tools/graphify\n' "$graphify_tools" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --no-deps -r "$graphify_tools/tools/graphify/requirements.txt"
      - name: Generate instructions graph and verify MCP read-back
        run: python scripts/build_instructions_graph.py
