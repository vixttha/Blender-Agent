name: Prepare or publish a Blender-Agent Refinement Toolkit pre-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Final release tag
        required: true
        type: string
      release_sha:
        description: Full approved default-branch commit SHA
        required: true
        type: string
      ci_run_id:
        description: Successful application CI push run ID
        required: true
        type: string
      publish:
        description: Publish the verified pre-release
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: blender-agent-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.repository.private == false
    uses: ./.github/workflows/release-approval.yml
    permissions:
      contents: read
      actions: read
    with:
      release_tag: ${{ inputs.release_tag }}
      release_sha: ${{ inputs.release_sha }}
      ci_run_id: ${{ inputs.ci_run_id }}

  publish:
    name: Publish the verified Blender-Agent Refinement Toolkit pre-release
    if: inputs.publish && needs.verify.result == 'success'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the approved release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          persist-credentials: false
      - name: Create the approved tag and publish its pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          notes_file="docs/releases/$RELEASE_TAG.md"
          [[ -s "$notes_file" ]]
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          encoded_branch="$(jq -nr --arg branch "$default_branch" '$branch | @uri')"
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$encoded_branch" --jq .sha)"
          [[ "$current_sha" == "$RELEASE_SHA" ]]

          # Create the tag at the approved SHA. The API rejects an existing ref.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST \
            -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_SHA" --silent
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          [[ "$tag_sha" == "$RELEASE_SHA" ]]
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease --notes-file "$notes_file" --title "Blender-Agent Refinement Toolkit $RELEASE_TAG"
