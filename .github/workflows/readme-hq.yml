name: README HQ validation

on:
  push:
    branches: [readme-hq]
  pull_request:
    branches: [readme-hq]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    if: github.event.repository.private == false
    name: Archived pages, links, draft gates and regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned action
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate README HQ
        run: python3 tools/check_readme_hq.py
      - name: Negative regression tests
        run: python3 -m unittest discover -s tests -p 'test_readme_hq.py' -v
      - name: Run the draft quick start from the published tag
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/readme-quick-start.sh" <<'PY'
          import re
          import sys
          from pathlib import Path

          draft = Path("workspace/v0.0.3/DRAFT.md").read_text(encoding="utf-8")
          quick_start = draft.split("## Quick start\n", 1)[1].split("\n### ", 1)[0]
          blocks = re.findall(r"^```sh\n(.*?)^```$", quick_start, re.M | re.S)
          if len(blocks) != 2:
              raise SystemExit("Expected two shell blocks in the quick start")
          Path(sys.argv[1]).write_text(
              blocks[0] + "source .venv/bin/activate\n" + blocks[1],
              encoding="utf-8",
          )
          PY

          quick_start_dir="$(mktemp -d)"
          cd "$quick_start_dir"
          source "$RUNNER_TEMP/readme-quick-start.sh"

          released_sha=cb945bd8531ee425615c1968612ab6503849369d
          test "$(git rev-parse HEAD)" = "$released_sha"
          git show HEAD:README.md | cmp - "$GITHUB_WORKSPACE/versions/v0.0.2/README.md"
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          version = json.loads(subprocess.check_output(["blender-agent", "version"]))
          inspection = json.loads(subprocess.check_output(
              ["blender-agent", "--workspace", "readme-demo", "inspect", "triangle.obj"]
          ))
          assert version["version"] == "0.0.2", version
          assert inspection["format"] == "obj", inspection
          assert (inspection["vertices"], inspection["faces"]) == (3, 1), inspection
          assert inspection["bounds"] == {"min": [0, 0, 0], "max": [1, 1, 0]}, inspection
          digest = hashlib.sha256(Path("readme-demo/triangle.obj").read_bytes()).hexdigest()
          assert inspection["sha256"] == digest, inspection
          print("Verified the v0.0.2 CLI, triangle geometry and digest, and archived README")
          PY
