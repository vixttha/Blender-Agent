name: Validate Code Stack template

on:
  push:
    branches: [code-stack-template]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test template with a synthetic multi-language repository
        run: python3 v0.0.1/tools/test_audit.py -v
      - name: Verify the portable release files
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 v0.0.1/tools/audit.py --help
          for item in README.md STACK.md STACK_MEMORY.md AUDIT.md PROPOSAL.md registry.example.json; do
            test -s "v0.0.1/$item"
          done
          {
            echo '### Code Stack template v0.0.1'
            echo "Validated template commit: $GITHUB_SHA"
            echo 'Portable inventory tested with a synthetic Python and TypeScript Git repository.'
          } >> "$GITHUB_STEP_SUMMARY"
