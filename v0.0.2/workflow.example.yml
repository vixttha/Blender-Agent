name: Audit Code Stack

on:
  push:
    branches: [code-stack]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Read the audited source pin
        id: registry
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          from pathlib import Path

          registry = json.loads(Path("code-stack/code-stack.json").read_text(encoding="utf-8"))
          rev = registry["source_commit"]
          if not re.fullmatch(r"[0-9a-f]{40}", rev):
              raise SystemExit("Expected a full GitHub source commit")
          if registry["source_repository"].casefold() != os.environ["EXPECTED_REPOSITORY"].casefold():
              raise SystemExit("This example expects the source in the same repository")
          print(f"source_commit={rev}")
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.registry.outputs.source_commit }}
          path: audited-source
          fetch-depth: 0
          persist-credentials: false
      - name: Audit tracked source and record the receipt
        run: |
          python3 code-stack/tools/audit.py --repo audited-source \
            --config code-stack/code-stack.json --live-ref refs/remotes/origin/main \
            --summary "$GITHUB_STEP_SUMMARY"
