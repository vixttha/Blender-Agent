name: Code Stack language review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Generate the language review
        run: |
          python3 code-stack/tools/stack.py --repo . --ref "$GITHUB_SHA" --out stack-review
          cat stack-review/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: code-stack-review
          path: stack-review/
          retention-days: 1
